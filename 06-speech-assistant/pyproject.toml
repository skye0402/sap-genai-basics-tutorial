[project]
name = "genai-speech-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "requests>=2.32",
    "websockets>=13.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    # tzlocal handles Windows -> IANA time-zone-name mapping. time.tzname
    # on Windows returns useless display names like "Tokyo Standard Time"
    # that aren't IANA identifiers; tzlocal converts them properly so the
    # model sees a name it can actually reason about.
    "tzlocal>=5.2",
]

[tool.uv]
# uv will use this pyproject to create an isolated environment
